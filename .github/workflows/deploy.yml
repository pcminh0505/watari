name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - run: uv sync --all-packages --frozen
      - run: uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy image
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Run database migrations
        run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name "db-migrate-${{ github.run_id }}" \
            --rm \
            --region sin \
            -- uv run alembic upgrade head
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Catalog strict verify (post-deploy gate)
        # Runs `catalog-verify --strict` against the prod database after
        # migrations succeed. Fails the deploy job (and surfaces a red
        # check on `main`) if any non-promo set has null `name_ja` or
        # `rarity_code`. Promo sets in `_STRICT_EXEMPT_SETS` are excluded.
        run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name "catalog-verify-${{ github.run_id }}" \
            --rm \
            --region sin \
            -- uv run python -m watari_catalog verify --strict
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
