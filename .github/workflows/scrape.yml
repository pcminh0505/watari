          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-promo-${{ matrix.set_code }} \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --set ${{ matrix.set_code }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  snkrdunk:
