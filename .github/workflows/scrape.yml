name: Scheduled scrapers
on:
  schedule:
    # Cardrush: SV + ME + CL daily at 00:00 and 08:00 UTC
    - cron: '0 0,8 * * *'
    # Cardrush: SW + SM + promos weekly on Saturday at 21:00 UTC
    - cron: '0 21 * * 6'
  # Snkrdunk jobs are workflow_dispatch only (not stored in DB; fetched on-demand by API)
  workflow_dispatch:
    inputs:
      job:
        description: "cardrush-sv | cardrush-me | cardrush-cl | cardrush-sw | cardrush-sm | cardrush-promos | snkrdunk | snkrdunk-legacy"
        required: true

jobs:
  cardrush-sv:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 0,8')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-sv')
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-sv \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --era SV
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  cardrush-me:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 0,8')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-me')
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-me \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --era ME
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  cardrush-cl:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 0,8')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-cl')
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-cl \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --era CL
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  cardrush-sw:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 21 * * 6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-sw')
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-sw \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --era SW
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  cardrush-sm:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 21 * * 6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-sm')
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
            "import sys,json; d=json.load(sys.stdin)[0]; print(d['Registry']+'/'+d['Repository']+':'+d['Tag'])")
          flyctl machine run "$IMAGE" \
            --app watari-api \
            --name scraper-cardrush-sm \
            --rm \
            --vm-size shared-cpu-2x \
            --region sin \
            -- uv run python -m watari_cardrush --era SM
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  cardrush-promos:
    if: >
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 21 * * 6')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'cardrush-promos')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        set_code:
          - MP
          - SMPR
          - SP
          - SVP
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: |
          IMAGE=$(flyctl image show --app watari-api --json | python3 -c \
