name: DB retention cleanup

on:
  schedule:
    # Every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  NEON_PROJECT_ID: fragrant-tooth-47031048

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Fetch connection string from Neon API
        id: conn
        run: |
          URI=$(curl -sf \
            "https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}/connection_uri?role_name=neondb_owner&database_name=neondb" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['uri'])")
          # Strip channel_binding — pooler rejects SCRAM-SHA-256-PLUS in some clients
          CLEAN=$(python3 -c "
          import sys, urllib.parse
          p = urllib.parse.urlparse(sys.argv[1])
          qs = {k: v[0] for k, v in urllib.parse.parse_qs(p.query).items() if k != 'channel_binding'}
          print(urllib.parse.urlunparse(p._replace(query=urllib.parse.urlencode(qs))))
          " "$URI")
          echo "uri=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Prune old price data
        run: |
          psql "${{ steps.conn.outputs.uri }}" <<'SQL'
            DELETE FROM price_points
            WHERE observed_at < NOW() - INTERVAL '30 days';

            DELETE FROM graded_price_points
            WHERE observed_at < NOW() - INTERVAL '90 days';

            VACUUM ANALYZE price_points;
            VACUUM ANALYZE graded_price_points;
          SQL

      - name: Report table sizes
        run: |
          psql "${{ steps.conn.outputs.uri }}" -c "
            SELECT c.relname AS tbl,
                   pg_size_pretty(pg_total_relation_size(c.oid)) AS size,
                   s.n_live_tup AS live_rows
            FROM pg_class c
            JOIN pg_stat_user_tables s ON s.relname = c.relname
            WHERE c.relkind = 'r'
              AND c.relnamespace = 'public'::regnamespace
            ORDER BY pg_total_relation_size(c.oid) DESC;"
