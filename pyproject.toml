[project]
name = "watari"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
    "watari-api",
    "watari-scheduler",
    "watari-dispatcher",
    "watari-cardrush",
    "watari-snkrdunk",
    "watari-catalog",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
watari-core = { workspace = true }
watari-api = { workspace = true }
watari-scheduler = { workspace = true }
watari-dispatcher = { workspace = true }
watari-cardrush = { workspace = true }
watari-snkrdunk = { workspace = true }
watari-catalog = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "vulture>=2.16",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Japanese HTML fixture strings exceed 100 chars; cannot be wrapped without
# breaking the test data. UP047 (PEP 695 type params) deferred — style only.
"tests/unit/test_cardrush_parser.py" = ["E501"]
"packages/scraper_cardrush/watari_cardrush/retry.py" = ["UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
