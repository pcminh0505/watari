[project]
name = "pokeprice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pokeprice-core",
    "pokeprice-api",
    "pokeprice-scheduler",
    "pokeprice-dispatcher",
    "pokeprice-cardrush",
    "pokeprice-snkrdunk",
    "pokeprice-catalog",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pokeprice-core = { workspace = true }
pokeprice-api = { workspace = true }
pokeprice-scheduler = { workspace = true }
pokeprice-dispatcher = { workspace = true }
pokeprice-cardrush = { workspace = true }
pokeprice-snkrdunk = { workspace = true }
pokeprice-catalog = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
