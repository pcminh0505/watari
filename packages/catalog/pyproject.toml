[project]
name = "watari-catalog"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
    "httpx>=0.27",
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
]

[tool.uv.sources]
watari-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watari_catalog"]
