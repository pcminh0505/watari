[project]
name = "pokeprice-cardrush"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pokeprice-core",
    "pokeprice-catalog",
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
pokeprice-core = { workspace = true }
pokeprice-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokeprice_cardrush"]
