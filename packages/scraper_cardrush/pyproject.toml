[project]
name = "watari-cardrush"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
    "watari-catalog",
    "curl-cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.uv.sources]
watari-core = { workspace = true }
watari-catalog = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watari_cardrush"]
