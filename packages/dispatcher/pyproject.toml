[project]
name = "watari-dispatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
]

[tool.uv.sources]
watari-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watari_dispatcher"]
