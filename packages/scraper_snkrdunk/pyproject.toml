[project]
name = "watari-snkrdunk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
    "httpx>=0.27",
]

[tool.uv.sources]
watari-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watari_snkrdunk"]
