[project]
name = "pokeprice-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pokeprice-core",
]

[tool.uv.sources]
pokeprice-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokeprice_api"]
