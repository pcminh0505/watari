[project]
name = "pokeprice-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pokeprice-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
]

[project.scripts]
pokeprice-api = "pokeprice_api.__main__:main"

[tool.uv.sources]
pokeprice-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokeprice_api"]
