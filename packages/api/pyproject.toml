[project]
name = "watari-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "watari-core",
    "watari-catalog",
    "watari-cardrush",
    "watari-snkrdunk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "redis>=5.0",
]

[project.scripts]
watari-api = "watari_api.__main__:main"

[tool.uv.sources]
watari-core = { workspace = true }
watari-catalog = { workspace = true }
watari-cardrush = { workspace = true }
watari-snkrdunk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watari_api"]
